<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Love❤️</title> 

<style>
  body {
    margin: 0;
    height: 100vh;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  canvas {
    position: absolute;
  }

  #text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 36px;
    font-family: Arial, sans-serif;
    color: white;
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 10;
    pointer-events: none;
  }

  .small-heart {
    position: absolute;
    color: pink;
    font-size: 16px;
    animation: float 6s infinite ease-in-out;
    opacity: 0.6;
  }

  @keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-25px); }
    100% { transform: translateY(0); }
  }
</style>
</head>

<body>

<canvas id="canvas" width="400" height="400"></canvas>
<div id="text">ملاك</div>

<audio id="beat" preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_8e1e9d9e43.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const text = document.getElementById("text");
const beat = document.getElementById("beat");

ctx.translate(200, 220);
ctx.scale(1, -1);

let t = 0;

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t);
  return { x: x * 10, y: y * 10 };
}

ctx.beginPath();

function drawHeart() {
  if (t <= Math.PI * 2) {
    const p = heartPoint(t);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = "red";
    ctx.lineWidth = 2;
    ctx.stroke();
    t += 0.03;
    requestAnimationFrame(drawHeart);
  } else {
    ctx.fillStyle = "red";
    ctx.fill();
    setTimeout(showText, 500);
  }
}

function showText() {
  text.style.opacity = 1;
  beat.play();
}

drawHeart();

// قلوب صغيرة
for (let i = 0; i < 30; i++) {
  const h = document.createElement("div");
  h.className = "small-heart";
  h.innerHTML = "❤";
  h.style.left = Math.random() * 100 + "vw";
  h.style.top = Math.random() * 100 + "vh";
  h.style.animationDelay = Math.random() * 5 + "s";
  document.body.appendChild(h);
}
</script>

</body>
</html>
